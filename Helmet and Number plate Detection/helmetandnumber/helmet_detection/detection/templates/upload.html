{% extends 'base.html' %}
{% block title %}Upload Video{% endblock %}

{% block content %}
<h2>Upload Video for Helmet & Number Plate Detection</h2>

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Upload</button>
</form>

{% if filename %}
  <hr>
  <h3>Live Detection Output</h3>
  <img src="{% url 'stream' filename %}" class="responsive-video">
  {% endif %}
{% endblock %}
