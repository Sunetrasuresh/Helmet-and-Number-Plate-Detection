{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<h2 style="margin-bottom: 20px;">Register</h2>

<form method="post" style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 400px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" style="margin-top: 15px;">Sign Up</button>
</form>
{% endblock %}
