<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Helmet Detection{% endblock %}</title>
    {% load static %}
    <style>
        /* Global layout reset */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* ✅ No scrollbars */
            font-family: Arial, sans-serif;
        }

        /* Fullscreen background */
        body {
            background-image: url("{% static 'images/image.png' %}");
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 100%;
        }

        /* ✅ Fixed top navigation bar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 15px 0;
            text-align: center;
            z-index: 1000;
        }

        nav a {
            color: #ffcc00;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* ✅ Main centered content area */
        .content {
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 25px;
            width: 80%;
            max-width: 800px;
            min-height: 60vh;
            max-height: 80vh;
            margin-top: 100px; /* space for nav bar */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-y: auto; /* only inner scroll if needed */
            box-sizing: border-box;
            text-align: center;
        }

        /* ✅ Responsive video or stream */
        .responsive-video {
            max-width: 90%;
            max-height: 60vh;
            border: 3px solid #00bcd4;
            border-radius: 8px;
            object-fit: contain;
            margin-top: 15px;
        }

        /* ✅ Buttons */
        button {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #cc0000;
        }

        /* ✅ Links */
        a {
            color: #00bcd4;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* ✅ Scrollbar hidden but smooth scroll inside content */
        .content::-webkit-scrollbar {
            width: 6px;
        }

        .content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav>
    {% if user.is_authenticated %}
        <span style="color:#00bcd4; margin-right:10px;">Welcome, {{ user.username }}!</span>
        <a href="{% url 'upload' %}">Upload</a> |
        <a href="{% url 'logout' %}">Logout</a>
    {% else %}
        <a href="{% url 'login' %}">Login</a> |
        <a href="{% url 'register' %}">Register</a>
    {% endif %}
</nav>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
